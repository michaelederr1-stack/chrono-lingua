[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-lingua"
version = "0.1.0"
description = "A core parsing and linguistic transformation utility"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
chrono-lingua = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
